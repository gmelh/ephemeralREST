################################################################################
################################################################################
###                                                                          ###
###                      docker-compose.yml                                 ###
###                   Docker Compose Configuration                          ###
###                                                                          ###
################################################################################
################################################################################

version: '3.8'

services:
  ephemeral-rest:
    build: .
    container_name: ephemeral-rest
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      # Database: DB_TYPE=sqlite (default) needs no further setup — the
      # file below is created automatically and lives on the ephemeral-data
      # volume. Set DB_TYPE=mysql (plus the MYSQL_* values) to run against
      # an external MySQL server instead — typically a shared database also
      # used by other companion services (see ARCHITECTURE.md, "Federated
      # service access"); DATABASE_PATH is ignored in that case.
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DATABASE_PATH=/app/data/ephemeral.db
      - MYSQL_HOST=${MYSQL_HOST:-}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-}
      - SWISS_EPHEMERIS_PATH=/app/sweph
      - LOG_FILE=/app/logs/google_api_usage.log
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - USAGE_COUNT_FILE=/app/data/api_usage_count.json
      - MAX_MONTHLY_REQUESTS=${MAX_MONTHLY_REQUESTS:-10000}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-True}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-50}
      - RATE_LIMIT_PER_DAY=${RATE_LIMIT_PER_DAY:-200}
      - CACHE_EXPIRY_DAYS=${CACHE_EXPIRY_DAYS:-90}
    volumes:
      - ./sweph:/app/sweph:ro
      # Only used when DB_TYPE=sqlite (the default). Unused, but harmless,
      # when running against external MySQL.
      - ephemeral-data:/app/data
      - ephemeral-logs:/app/logs
    # Lets the container reach services running directly on the VPS host
    # (e.g. a locally-installed MySQL) via host.docker.internal — a
    # container's "localhost" is otherwise itself, not the host. Only
    # relevant when MYSQL_HOST=host.docker.internal is set in .env; no
    # effect otherwise. Requires Docker Engine 20.10+ (host-gateway support
    # on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ephemeral-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy — fronts both ephemeral-rest (API) and
  # ephemeral-admin (portal). See nginx.conf: port 80 → API, port 8080 → portal.
  nginx:
    image: nginx:alpine
    container_name: ephemeral-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Real certificates from certbot running on the host (see DOCS/SETUP.md,
      # "Docker deployment") — only needed if using the real-domain HTTPS
      # server blocks in nginx.conf; harmless otherwise.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME HTTP-01 challenge webroot, shared with the host's certbot
      # process for certificate renewal. Create this directory on the host
      # before first run: mkdir -p /srv/ephemeral/certbot-webroot
      - /srv/ephemeral/certbot-webroot:/var/www/certbot:ro
      # Read-only access to the portal's code, so nginx can serve static
      # assets directly and resolve SCRIPT_FILENAME for fastcgi_pass to
      # ephemeral-admin. Populated automatically from the ephemeral-admin
      # image the first time this volume is created (standard Docker
      # behaviour for a named volume mounted over a directory with content
      # already baked into the image).
      - admin-app:/var/www/html:ro
    depends_on:
      - ephemeral-rest
      - ephemeral-admin
    networks:
      - ephemeral-network

  # ephemeralADMIN — the PHP admin portal. PHP-FPM only, no bundled web
  # server; nginx (above) is the front door and proxies *.php requests to
  # this container over FastCGI. Separate image from ephemeral-rest — MIT
  # licensed, no database access, and no reason to share a process, restart
  # policy, or attack surface with the API that holds SECRET_KEY.
  ephemeral-admin:
    build: ../ephemeralADMIN
    container_name: ephemeral-admin
    restart: unless-stopped
    environment:
      # Internal Docker network address — what the portal actually
      # connects to. Deliberately not the public API URL: this stays
      # inside the Docker network, bypassing nginx/TLS entirely.
      - API_BASE=http://ephemeral-rest:5000
      # What gets *displayed* to an admin (Dashboard "Endpoint" field,
      # API Tester header) — set this to your real public API URL, e.g.
      # https://api.yourdomain.com. Falls back to API_BASE (the internal
      # address above) if left unset, so this is optional.
      - API_PUBLIC_URL=${API_PUBLIC_URL:-}
    volumes:
      - admin-app:/var/www/html
    depends_on:
      - ephemeral-rest
    networks:
      - ephemeral-network

volumes:
  ephemeral-data:
    driver: local
  ephemeral-logs:
    driver: local
  admin-app:
    driver: local

networks:
  ephemeral-network:
    driver: bridge
    ipam:
      config:
        # Pinned rather than auto-assigned, so it's a known, fixed value
        # you can firewall against (see DOCS/DOCKER_DEPLOYMENT_CHECKLIST.md
        # Phase 4) without needing to inspect the network after the fact —
        # useful since the network doesn't exist until first `docker
        # compose up`, but the firewall rule needs to be in place before
        # MySQL is exposed at all.
        - subnet: 172.28.0.0/16