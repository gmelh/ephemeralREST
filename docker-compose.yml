# Development stack. Servers are installed with the one-line installer instead
# (install/install.sh), which writes its own compose file.
#
#   docker compose up --build
#   open http://localhost:8080 and create the administrator account
#   docker compose exec app ephemeral fetch-ephemeris
#   docker compose exec app ephemeral import-cities
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SECRET_KEY: dev-only-secret-change-me-0123456789abcdef
      PUBLIC_URL: http://localhost:8080
      USE_GOOGLE: "false"
      # In Email settings use host "mailpit", port 1025, security None,
      # any username and password.
    volumes:
      - data:/data

  # Catches every email the app sends. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  data:
