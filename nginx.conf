################################################################################
################################################################################
###                                                                          ###
###                          nginx.conf                                     ###
###                  Nginx Reverse Proxy Configuration                      ###
###                                                                          ###
################################################################################
################################################################################

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=calc_limit:10m rate=5r/s;

    # Upstream to the ephemeralREST API (service name from docker-compose.yml)
    upstream astro_api {
        server ephemeral-rest:5000 fail_timeout=30s max_fails=3;
    }

    # Upstream to the ephemeralADMIN portal's PHP-FPM process
    upstream admin_php_fpm {
        server ephemeral-admin:9000 fail_timeout=30s max_fails=3;
    }

    # HTTP server (redirect to HTTPS in production)
    server {
        listen 80;
        server_name _;

        # Uncomment for HTTPS redirect in production
        # return 301 https://$server_name$request_uri;

        # Comment out this location block if using HTTPS redirect
        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://astro_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        # Stricter rate limit for calculate endpoint
        location /calculate {
            limit_req zone=calc_limit burst=10 nodelay;

            proxy_pass http://astro_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        # Health check (no rate limit)
        location /health {
            proxy_pass http://astro_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
    }

    # ephemeralADMIN portal.
    #
    # Separate listen port (rather than a second server_name-based vhost)
    # so this works out of the box under `docker compose up` without
    # needing DNS or /etc/hosts entries. For a production deployment with
    # real domains and TLS, switch this to server_name-based vhosts on
    # listen 443 instead — same pattern as DOCS/SETUP.md's bare-metal
    # nginx config, just pointed at admin_php_fpm instead of a local
    # php-fpm socket.
    server {
        listen 8080;
        server_name _;

        root  /var/www/html;
        index index.php;

        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;

        # Block direct access to includes — same rule as the bare-metal config
        location ~ ^/includes/ {
            deny all;
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass  admin_php_fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include       fastcgi_params;
        }
    }

    # ==========================================================================
    # Production: real domains + HTTPS via Let's Encrypt.
    #
    # Replace api.yourdomain.com and admin.yourdomain.com below with your
    # real domains (each appears twice — once per server_name, and the cert
    # paths below assume a single certificate covering both as SANs, issued
    # via `certbot certonly -d api.yourdomain.com -d admin.yourdomain.com`,
    # which certbot stores under the first domain's directory name). Point
    # DNS A records at this VPS before running certbot. See DOCS/SETUP.md's
    # "Docker deployment" section for the full certbot command sequence.
    #
    # These blocks only activate once their server_name matches an incoming
    # Host header — the IP-only quick-start blocks above are unaffected and
    # keep working for anyone not using real domains.
    # ==========================================================================

    # ACME HTTP-01 challenge (for certbot renewals) + HTTPS redirect
    server {
        listen 80;
        server_name api.yourdomain.com admin.yourdomain.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name api.yourdomain.com;

        ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://astro_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        location /calculate {
            limit_req zone=calc_limit burst=10 nodelay;

            proxy_pass http://astro_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        location /health {
            proxy_pass http://astro_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
    }

    server {
        listen 443 ssl http2;
        server_name admin.yourdomain.com;

        # Same certificate as the api. block above (multi-SAN) — see note up top.
        ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        root  /var/www/html;
        index index.php;

        location ~ ^/includes/ {
            deny all;
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass  admin_php_fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include       fastcgi_params;
        }
    }
}