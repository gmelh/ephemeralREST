################################################################################
################################################################################
###                                                                          ###
###                          nginx.conf                                     ###
###                  Nginx Reverse Proxy Configuration                      ###
###                                                                          ###
################################################################################
################################################################################

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=calc_limit:10m rate=5r/s;

    upstream astro_api {
        server ephemeral-rest:5000 fail_timeout=30s max_fails=3;
    }

    upstream admin_php_fpm {
        server ephemeral-admin:9000 fail_timeout=30s max_fails=3;
    }

    upstream marketrest_api {
        server marketrest:5001 fail_timeout=30s max_fails=3;
    }

    upstream searchrest_api {
        server searchrest:8000 fail_timeout=30s max_fails=3;
    }

    server {
        listen 80;
        server_name _;

        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://astro_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        location /calculate {
            limit_req zone=calc_limit burst=10 nodelay;

            proxy_pass http://astro_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        location /health {
            proxy_pass http://astro_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
    }

    server {
        listen 8080;
        server_name _;

        root  /var/www/html;
        index index.php;

        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;

        location ~ ^/includes/ {
            deny all;
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass  admin_php_fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include       fastcgi_params;

            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout    300s;
            fastcgi_read_timeout    300s;
        }
    }

    server {
        listen 80;
        server_name api.yoohoo.network admin.yoohoo.network;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name api.yoohoo.network;

        ssl_certificate     /etc/letsencrypt/live/api.yoohoo.network/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yoohoo.network/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Strip any CORS headers the upstream service itself already sets
        # (ephemeral-rest/marketrest/searchrest may set their own) — nginx's
        # add_header below does NOT replace an existing upstream header, it
        # appends to it, which produces an invalid multi-value header the
        # browser rejects outright ("contains multiple values ... but only
        # one is allowed"). Hiding the upstream's version first means only
        # nginx's value reaches the browser.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Api-Key' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location /market/ {
            proxy_pass http://marketrest_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        location /search/ {
            proxy_pass http://searchrest_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 120s;
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://astro_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        location /calculate {
            limit_req zone=calc_limit burst=10 nodelay;

            proxy_pass http://astro_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 120s;
        }

        location /health {
            proxy_pass http://astro_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
    }

    server {
        listen 443 ssl http2;
        server_name admin.yoohoo.network;

        ssl_certificate     /etc/letsencrypt/live/api.yoohoo.network/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.yoohoo.network/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        root  /var/www/html;
        index index.php;

        location ~ ^/includes/ {
            deny all;
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass  admin_php_fpm;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include       fastcgi_params;

            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout    300s;
            fastcgi_read_timeout    300s;
        }
    }
}