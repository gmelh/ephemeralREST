################################################################################
################################################################################
###                                                                          ###
###                   docker-compose.prod.yml                               ###
###         Production — pulls pre-built images, does not build from       ###
###         source. Use this on production; use docker-compose.yml (the    ###
###         one that builds locally) on your test box. See DOCS/           ###
###         DOCKER_DEPLOYMENT_CHECKLIST.md, "Build once, deploy the same   ###
###         image" for the full tag/push/pull sequence this depends on.    ###
###                                                                          ###
################################################################################
################################################################################

version: '3.8'

services:
  ephemeral-rest:
    image: ${REGISTRY}/ephemeral-rest:${IMAGE_TAG:-latest}
    container_name: ephemeral-rest
    restart: unless-stopped
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      # Database — this MUST be its own separate database from whatever you
      # used for testing. Never point production at the same MySQL instance
      # (or the same managed database) as a test deployment; keys, charts,
      # and everything else created while testing would become "real" data.
      - DB_TYPE=${DB_TYPE:-sqlite}
      - DATABASE_PATH=/app/data/ephemeral.db
      - MYSQL_HOST=${MYSQL_HOST:-}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-}
      - SWISS_EPHEMERIS_PATH=/app/sweph
      - LOG_FILE=/app/logs/google_api_usage.log
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - USAGE_COUNT_FILE=/app/data/api_usage_count.json
      - MAX_MONTHLY_REQUESTS=${MAX_MONTHLY_REQUESTS:-10000}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-True}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - RATE_LIMIT_PER_HOUR=${RATE_LIMIT_PER_HOUR:-50}
      - RATE_LIMIT_PER_DAY=${RATE_LIMIT_PER_DAY:-200}
      - CACHE_EXPIRY_DAYS=${CACHE_EXPIRY_DAYS:-90}
    volumes:
      # Swiss Ephemeris data files are never baked into the image — they're
      # mounted from the host on every box that runs this, test or prod.
      # Make sure ./sweph is populated here too (see Phase 3 of the
      # deployment checklist); the image being identical to what you tested
      # doesn't help if this directory is empty.
      - ./sweph:/app/sweph:ro
      - ephemeral-data:/app/data
      - ephemeral-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ephemeral-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: ephemeral-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /srv/ephemeral/certbot-webroot:/var/www/certbot:ro
      - admin-app:/var/www/html:ro
    depends_on:
      - ephemeral-rest
      - ephemeral-admin
    networks:
      - ephemeral-network

  ephemeral-admin:
    image: ${REGISTRY}/ephemeral-admin:${IMAGE_TAG:-latest}
    container_name: ephemeral-admin
    restart: unless-stopped
    environment:
      # Internal Docker network address — what the portal actually
      # connects to. Deliberately not the public API URL: this stays
      # inside the Docker network, bypassing nginx/TLS entirely.
      - API_BASE=http://ephemeral-rest:5000
      # What gets *displayed* to an admin (Dashboard "Endpoint" field,
      # API Tester header) — set this to your real public API URL, e.g.
      # https://api.yourdomain.com. Falls back to API_BASE (the internal
      # address above) if left unset, so this is optional.
      - API_PUBLIC_URL=${API_PUBLIC_URL:-}
    volumes:
      - admin-app:/var/www/html
    depends_on:
      - ephemeral-rest
    networks:
      - ephemeral-network

volumes:
  ephemeral-data:
    driver: local
  ephemeral-logs:
    driver: local
  admin-app:
    driver: local

networks:
  ephemeral-network:
    driver: bridge
    ipam:
      config:
        # Must match docker-compose.yml's pinned subnet — same firewall
        # rule (see DOCS/DOCKER_DEPLOYMENT_CHECKLIST.md Phase 4) needs to
        # apply on production too.
        - subnet: 172.28.0.0/16