# Publishes a release when a version tag is pushed (e.g. git tag -a v1.0.0 && git push origin v1.0.0):
#   1. runs all the checks (ci.yml);
#   2. builds the image for Intel/AMD and ARM servers and pushes it to GHCR,
#      tagged 1.0.0, 1.0, 1 and latest;
#      a pre-release tag like v1.0.0-rc.1 gets only its own version tag, never latest;
#   3. creates a GitHub release with install.sh and its SHA-256 checksum attached.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ephemeralrest

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Installer and checksum
        run: |
          cp install/install.sh install.sh
          sha256sum install.sh > install.sh.sha256
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sum=$(cut -d' ' -f1 install.sh.sha256)
          version=${TAG#v}
          prerelease=""
          case $version in *-*) prerelease="--prerelease" ;; esac  # e.g. 1.0.0-rc.1
          {
            echo "Install on a fresh Ubuntu or Debian server:"
            echo
            echo '```sh'
            echo 'curl -fsSL https://raw.githubusercontent.com/gmelh/ephemeralREST/main/install/install.sh | sudo bash'
            echo '```'
            echo
            echo "Update an existing install: \`ephemeral update\`"
            echo
            echo "Image: \`${IMAGE}:${version}\`"
            echo
            echo "install.sh SHA-256: \`${sum}\`"
          } > notes.md
          gh release create "$TAG" install.sh install.sh.sha256 \
            --title "ephemeralREST ${version}" --notes-file notes.md $prerelease
